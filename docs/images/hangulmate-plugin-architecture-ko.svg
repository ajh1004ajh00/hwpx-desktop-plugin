1203 662V679" fill="none" stroke="#008e83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1090" y="697" width="151" height="31" rx="3" fill="white" stroke="#b7d2f5" stroke-width="1.5"/><path d="M1090 712H1241M1140 697V728M1190 697V728" fill="none" stroke="#b7d2f5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1470" y="678" text-anchor="middle" font-size="24" class="teal" font-weight="600">RHWP 문서 엔진</text><text x="1470" y="715" text-anchor="middle" font-size="23" class="" font-weight="600">편집 UI</text><text x="900" y="856" text-anchor="middle" font-size="19" class="muted" font-weight="400">WebMCP 지원 호스트에서 사용 · 도구는 편집기 페이지에 등록</text></svg>