<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="seoul-title seoul-desc"><title id="seoul-title">한글메이트 AI 사용자 공동 문서 편집</title><desc id="seoul-desc">사용자 직접 입력과 AI WebMCP 도구 입력이 같은 rhwp 문서와 실행 취소 기록을 공유한다. 문서 및 커서 스냅샷 검증을 거쳐 AI 변경을 반영한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#85909c"/></marker></defs><style>text{font-family:Malgun Gothic,Segoe UI,Arial,sans-serif;fill:#1c1e21}.muted{fill:#65717e}.blue{fill:#2478ed}.teal{fill:#008e83}</style><rect width="1800" height="900" fill="white"/><text x="900" y="67" text-anchor="middle" font-size="36" class="" font-weight="600">한글메이트 · 플러그인과 편집기의 역할</text><text x="900" y="111" text-anchor="middle" font-size="22" class="muted" font-weight="400">Skill은 사용 방법을 안내하고, 편집기는 실제 문서 도구를 실행</text><rect x="70" y="175" width="660" height="620" rx="16" fill="#f7faff" stroke="#b7d2f5" stroke-width="1.5"/><rect x="1010" y="175" width="720" height="620" rx="16" fill="#f4faf9" stroke="#b4dcd6" stroke-width="1.5"/><path d="M730 420H1010" fill="none" stroke="#85909c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="870" y="365" text-anchor="middle" font-size="18" class="muted" font-weight="400">AI가 Skill을 참고해</text><text x="870" y="393" text-anchor="middle" font-size="20" class="blue" font-weight="600">페이지 도구 호출</text><rect x="108" y="215" width="58" height="70" rx="6" fill="white" stroke="#2478ed" stroke-width="1.5"/><path d="M121 235h32" fill="none" stroke="#2478ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M121 250h32" fill="none" stroke="#2478ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M121 265h32" fill="none" stroke="#2478ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="245" text-anchor="start" font-size="27" class="" font-weight="600">한글메이트 플러그인</text><text x="195" y="282" text-anchor="start" font-size="21" class="blue" font-weight="400">Skill · 작업 안내와 규칙</text><circle cx="125" cy="349" r="5" fill="#2478ed"/><text x="150" y="356" text-anchor="start" font-size="23" class="" font-weight="600">Sites URL 안내</text><text x="150" y="387" text-anchor="start" font-size="18" class="muted" font-weight="400">공개 편집기 열기</text><circle cx="125" cy="431" r="5" fill="#2478ed"/><text x="150" y="438" text-anchor="start" font-size="23" class="" font-weight="600">WebMCP 도구 이름·사용 순서</text><text x="150" y="469" text-anchor="start" font-size="18" class="muted" font-weight="400">대상 확인 → 읽기 → 편집 → 결과 확인</text><circle cx="125" cy="513" r="5" fill="#2478ed"/><text x="150" y="520" text-anchor="start" font-size="23" class="" font-weight="600">데이터 최소화 규칙</text><text x="150" y="551" text-anchor="start" font-size="18" class="muted" font-weight="400">요청한 범위만 읽고 전달</text><circle cx="125" cy="595" r="5" fill="#2478ed"/><text x="150" y="602" text-anchor="start" font-size="23" class="" font-weight="600">Computer Use 사용 조건</text><text x="150" y="633" text-anchor="start" font-size="18" class="muted" font-weight="400">파일 선택·저장 등 필요한 UI 작업</text><rect x="1048" y="215" width="78" height="60" rx="7" fill="white" stroke="#008e83" stroke-width="1.5"/><path d="M1048 232H1126" fill="none" stroke="#b4dcd6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1150" y="245" text-anchor="start" font-size="27" class="" font-weight="600">공개 Sites 편집기</text><text x="1150" y="282" text-anchor="start" font-size="21" class="teal" font-weight="400">실제 WebMCP 도구 8개 등록·실행</text><rect x="1050" y="330" width="300" height="49" rx="8" fill="white" stroke="#b4dcd6" stroke-width="1.5"/><text x="1200" y="362" text-anchor="middle" font-size="20" class="" font-weight="400">커서·선택 읽기</text><rect x="1380" y="330" width="300" height="49" rx="8" fill="white" stroke="#b4dcd6" stroke-width="1.5"/><text x="1530" y="362" text-anchor="middle" font-size="2